server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: erp-insurance-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/erp_insurance}
    username: ${DB_USERNAME:erp_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-ttl-minutes: ${JWT_TTL_MINUTES:15}
  encryption:
    key: ${ENCRYPTION_KEY:}
  cors:
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:4200,http://localhost:3000}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}

springdoc:
  swagger-ui:
    path: /api/docs
  api-docs:
    path: /api/openapi